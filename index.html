<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>PGT Global Network | Purpose-Driven Learning & Innovation Ecosystem</title>
    <meta name="title" content="PGT Global Network | Purpose-Driven Learning & Innovation Ecosystem" />
    <meta name="description" content="PGT Global Network is a purpose-driven global organization dedicated to driving digital education, community transformation, and global leadership." />
    <meta name="keywords" content="PGT Global Network, PGT, digital education, youth empowerment, community leadership, global organization, sustainable development, learning ecosystem" />
    <meta name="author" content="PGT Global Network" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pgtglobalnetwork.com/" />
    <meta property="og:title" content="PGT Global Network | Purpose-Driven Learning & Innovation Ecosystem" />
    <meta property="og:description" content="PGT Global Network is a purpose-driven global organization dedicated to driving digital education, community transformation, and global leadership." />
    <meta property="og:image" content="https://pgtglobalnetwork.com/PGT%20New%20Logo%20Transparent.png" />
    <meta property="og:site_name" content="PGT Global Network" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pgtglobalnet" />
    <meta name="twitter:title" content="PGT Global Network | Purpose-Driven Learning & Innovation Ecosystem" />
    <meta name="twitter:description" content="PGT Global Network is a purpose-driven global organization dedicated to driving digital education, community transformation, and global leadership." />
    <meta name="twitter:image" content="https://pgtglobalnetwork.com/PGT%20New%20Logo%20Transparent.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://pgtglobalnetwork.com/" />

    <!-- Favicons & App Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />

    <!-- Preconnect Hints for External Resources -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />

    <script>
      (function() {
        const theme = sessionStorage.getItem('pgt-theme') || 'light';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
